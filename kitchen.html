<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kitchen Dashboard</title>

  <style>
    :root {
      --background: #f7f4ef;
      --surface: #ffffff;
      --text: #241d18;
      --text-dim: #756b63;
      --line: #ddd5cc;
      --copper: #a45b32;

      --new: #d97706;
      --preparing: #2563eb;
      --ready: #16a34a;
      --completed: #6b7280;

      --available: #16a34a;
      --unavailable: #dc2626;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    button {
      font: inherit;
    }

    /* =====================================================
       HEADER
    ===================================================== */

    .header {
      position: sticky;
      top: 0;
      z-index: 20;

      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 20px;

      padding: 18px 28px;

      background: rgba(247, 244, 239, .96);

      border-bottom: 1px solid var(--line);

      backdrop-filter: blur(12px);
    }

    .brand small {
      display: block;

      margin-bottom: 5px;

      color: var(--copper);

      font-size: 11px;
      font-weight: 700;

      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .brand h1 {
      margin: 0;

      font-size: 25px;
    }

    .header-right {
      display: flex;
      align-items: center;

      gap: 8px;
    }

    .order-count,
    .availability-count {
      padding: 8px 13px;

      border-radius: 999px;

      background: var(--surface);

      border: 1px solid var(--line);

      font-size: 13px;
      font-weight: 700;
    }

    .availability-count {
      color: var(--available);
    }

    .sound-button {
      border: 1px solid var(--line);

      background: var(--surface);
      color: var(--text);

      padding: 9px 13px;

      border-radius: 999px;

      cursor: pointer;
    }

    /* =====================================================
       TABS
    ===================================================== */

    .main-tabs {
      display: flex;
      gap: 8px;

      padding: 18px 28px 4px;

      border-bottom: 1px solid var(--line);
    }

    .main-tab {
      border: 0;

      background: transparent;

      color: var(--text-dim);

      padding: 10px 16px;

      border-radius: 10px 10px 0 0;

      cursor: pointer;

      font-weight: 700;
    }

    .main-tab.active {
      background: var(--copper);
      color: white;
    }

    /* =====================================================
       ORDER FILTERS
    ===================================================== */

    .filters {
      display: flex;
      gap: 8px;

      overflow-x: auto;

      padding: 18px 28px 4px;
    }

    .filter-button {
      border: 1px solid var(--line);

      background: var(--surface);
      color: var(--text-dim);

      padding: 9px 15px;

      border-radius: 999px;

      cursor: pointer;

      white-space: nowrap;
    }

    .filter-button.active {
      background: var(--copper);

      border-color: var(--copper);

      color: white;
    }

    /* =====================================================
       CONTENT
    ===================================================== */

    .page {
      padding: 24px 28px 50px;
    }

    .hidden {
      display: none !important;
    }

    /* =====================================================
       ORDERS
    ===================================================== */

    .orders-grid {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(300px, 1fr)
        );

      gap: 18px;
    }

    .order-card {
      overflow: hidden;

      background: var(--surface);

      border: 1px solid var(--line);

      border-radius: 18px;

      box-shadow:
        0 8px 30px
        rgba(30, 20, 10, .06);
    }

    .order-card.new {
      border-top: 5px solid var(--new);
    }

    .order-card.preparing {
      border-top: 5px solid var(--preparing);
    }

    .order-card.ready {
      border-top: 5px solid var(--ready);
    }

    .order-card.completed {
      border-top: 5px solid var(--completed);

      opacity: .75;
    }

    .order-head {
      display: flex;

      justify-content: space-between;
      align-items: flex-start;

      gap: 12px;

      padding: 18px;

      border-bottom: 1px solid var(--line);
    }

    .order-number {
      margin: 0;

      font-size: 17px;
      font-weight: 800;
    }

    .order-time {
      margin-top: 5px;

      color: var(--text-dim);

      font-size: 12px;
    }

    .table-badge {
      padding: 8px 11px;

      border-radius: 10px;

      background: #f0e9e2;

      color: var(--copper);

      font-size: 12px;
      font-weight: 800;
    }

    .status {
      display: inline-block;

      margin-top: 10px;

      padding: 5px 9px;

      border-radius: 999px;

      font-size: 10px;
      font-weight: 800;

      text-transform: uppercase;

      letter-spacing: .08em;
    }

    .status-new {
      background: #fff1d6;
      color: #a15c00;
    }

    .status-preparing {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .status-ready {
      background: #dcfce7;
      color: #15803d;
    }

    .status-completed {
      background: #e5e7eb;
      color: #4b5563;
    }

    .customer {
      padding: 14px 18px;

      background: #faf8f5;

      border-bottom: 1px solid var(--line);
    }

    .customer strong {
      display: block;

      margin-bottom: 4px;
    }

    .customer div {
      color: var(--text-dim);

      font-size: 12px;
    }

    .items {
      padding: 8px 18px;
    }

    .item {
      display: flex;

      justify-content: space-between;

      gap: 12px;

      padding: 13px 0;

      border-bottom:
        1px dashed var(--line);
    }

    .item:last-child {
      border-bottom: 0;
    }

    .item-name {
      font-weight: 700;
    }

    .item-qty {
      display: inline-flex;

      min-width: 28px;
      height: 28px;

      align-items: center;
      justify-content: center;

      margin-right: 8px;

      border-radius: 8px;

      background: var(--copper);

      color: white;

      font-size: 12px;
      font-weight: 800;
    }

    .item-price {
      color: var(--text-dim);

      font-size: 13px;

      white-space: nowrap;
    }

    .notes {
      margin: 0 18px 15px;

      padding: 12px;

      border-radius: 10px;

      background: #fff8e7;

      border: 1px solid #f2dfad;

      color: #73541a;

      font-size: 12px;

      line-height: 1.5;
    }

    .notes strong {
      display: block;

      margin-bottom: 4px;
    }

    .order-total {
      display: flex;

      justify-content: space-between;

      padding: 14px 18px;

      border-top: 1px solid var(--line);

      font-size: 15px;
      font-weight: 800;
    }

    .order-actions {
      display: grid;

      gap: 8px;

      padding: 0 18px 18px;
    }

    .action-button {
      width: 100%;

      padding: 11px 14px;

      border: 0;

      border-radius: 10px;

      cursor: pointer;

      color: white;

      font-weight: 700;
    }

    .start-button {
      background: var(--preparing);
    }

    .ready-button {
      background: var(--ready);
    }

    .complete-button {
      background: var(--completed);
    }

    .cancel-button {
      background: transparent;

      color: #dc2626;

      border: 1px solid #fecaca;
    }

    /* =====================================================
       AVAILABILITY
    ===================================================== */

    .availability-header {
      display: flex;

      justify-content: space-between;
      align-items: center;

      margin-bottom: 20px;
    }

    .availability-header h2 {
      margin: 0;

      font-size: 25px;
    }

    .availability-header p {
      margin: 6px 0 0;

      color: var(--text-dim);

      font-size: 13px;
    }

    .menu-grid {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(280px, 1fr)
        );

      gap: 15px;
    }

    .menu-card {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 15px;

      padding: 17px;

      background: var(--surface);

      border: 1px solid var(--line);

      border-radius: 15px;
    }

    .menu-info {
      min-width: 0;
    }

    .menu-name {
      font-size: 15px;

      font-weight: 800;

      word-break: break-word;
    }

    .menu-price {
      margin-top: 5px;

      color: var(--text-dim);

      font-size: 12px;
    }

    .availability-status {
      display: inline-block;

      margin-top: 8px;

      padding: 5px 8px;

      border-radius: 999px;

      font-size: 10px;

      font-weight: 800;

      text-transform: uppercase;
    }

    .availability-status.available {
      background: #dcfce7;

      color: #15803d;
    }

    .availability-status.unavailable {
      background: #fee2e2;

      color: #b91c1c;
    }

    .availability-toggle {
      min-width: 105px;

      border: 0;

      padding: 10px 13px;

      border-radius: 10px;

      cursor: pointer;

      color: white;

      font-size: 12px;

      font-weight: 800;
    }

    .availability-toggle.available {
      background: var(--available);
    }

    .availability-toggle.unavailable {
      background: var(--unavailable);
    }

    .no-menu {
      padding: 60px 20px;

      text-align: center;

      color: var(--text-dim);
    }

    /* =====================================================
       EMPTY
    ===================================================== */

    .empty {
      padding: 80px 20px;

      text-align: center;

      color: var(--text-dim);
    }

    .empty-icon {
      font-size: 45px;

      margin-bottom: 15px;
    }

    .empty h2 {
      margin: 0 0 8px;

      color: var(--text);
    }

    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 650px) {

      .header {
        padding: 15px;

        align-items: flex-start;
      }

      .header-right {
        flex-wrap: wrap;

        justify-content: flex-end;
      }

      .order-count,
      .availability-count {
        font-size: 11px;

        padding: 7px 9px;
      }

      .sound-button {
        font-size: 11px;
      }

      .brand h1 {
        font-size: 20px;
      }

      .main-tabs {
        padding-left: 15px;
        padding-right: 15px;
      }

      .filters {
        padding-left: 15px;
        padding-right: 15px;
      }

      .page {
        padding: 18px 15px 40px;
      }

      .orders-grid,
      .menu-grid {
        grid-template-columns: 1fr;
      }

      .menu-card {
        align-items: flex-start;
      }

    }
  </style>
</head>

<body>

  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header class="header">

    <div class="brand">

      <small>
        ABUDI COFFEE ROASTERS
      </small>

      <h1>
        Kitchen Dashboard
      </h1>

    </div>

    <div class="header-right">

      <div class="order-count">
        <span id="orderCount">0</span>
        Orders
      </div>

      <div class="availability-count">
        <span id="availableCount">0</span>
        Available
      </div>

      <button
        id="soundButton"
        class="sound-button"
        type="button">

        🔔 Sound: On

      </button>

    </div>

  </header>


  <!-- =====================================================
       MAIN TABS
  ====================================================== -->

  <nav class="main-tabs">

    <button
      class="main-tab active"
      data-main-tab="orders">

      🍳 Orders

    </button>

    <button
      class="main-tab"
      data-main-tab="availability">

      🍕 Menu Availability

    </button>

  </nav>


  <!-- =====================================================
       ORDERS SECTION
  ====================================================== -->

  <section
    id="ordersSection">

    <nav class="filters">

      <button
        class="filter-button active"
        data-filter="all">

        All

      </button>

      <button
        class="filter-button"
        data-filter="new">

        🟠 New

      </button>

      <button
        class="filter-button"
        data-filter="preparing">

        🔵 Preparing

      </button>

      <button
        class="filter-button"
        data-filter="ready">

        🟢 Ready

      </button>

      <button
        class="filter-button"
        data-filter="completed">

        Completed

      </button>

    </nav>


    <main class="page">

      <div
        id="ordersGrid"
        class="orders-grid">
      </div>


      <div
        id="emptyState"
        class="empty"
        hidden>

        <div class="empty-icon">
          🍳
        </div>

        <h2>
          No orders
        </h2>

        <p>
          New customer orders will appear here.
        </p>

      </div>

    </main>

  </section>


  <!-- =====================================================
       AVAILABILITY SECTION
  ====================================================== -->

  <section
    id="availabilitySection"
    class="hidden">

    <main class="page">

      <div class="availability-header">

        <div>

          <h2>
            Menu Availability
          </h2>

          <p>
            Turn menu items on or off when
            something is unavailable.
          </p>

        </div>

      </div>


      <div
        id="menuGrid"
        class="menu-grid">
      </div>


      <div
        id="noMenu"
        class="no-menu"
        hidden>

        <h2>
          No menu items found
        </h2>

        <p>
          Open the customer menu once so
          the kitchen can load the menu items.
        </p>

      </div>

    </main>

  </section>


  <script src="kitchen.js"></script>

</body>
</html>
